apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/ValeriiYermak/MLOps-CI-CD.git
    targetRevision: final-project
    path: k8s/inference
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
