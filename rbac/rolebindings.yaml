apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-engineer-staging-binding
  namespace: staging
subjects:
  - kind: User
    name: mlops-engineer  # приклад — у реальному кластері це IAM/OIDC identity
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlops-engineer-full
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-engineer-production-binding
  namespace: production
subjects:
  - kind: User
    name: mlops-engineer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mlops-engineer-limited
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: viewer-binding
subjects:
  - kind: User
    name: viewer-user  # приклад
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: viewer
  apiGroup: rbac.authorization.k8s.io
