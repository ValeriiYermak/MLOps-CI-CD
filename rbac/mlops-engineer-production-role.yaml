apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-engineer-limited
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Явно НЕ дозволено: delete на deployments/services, доступ до secrets,
  # зміна RBAC-ресурсів (roles/rolebindings) — це запобігає випадковому
  # чи зловмисному знищенню production-навантаження чи ескалації прав.
