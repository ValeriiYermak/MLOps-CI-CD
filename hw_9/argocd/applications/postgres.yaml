apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.20
    helm:
      values: |
        global:
          imagePullSecrets: []

        image:
          repository: bitnamilegacy/postgresql

        auth:
          username: mlflow
          password: mlflow123
          database: mlflow
          postgresPassword: postgres123

        primary:
          service:
            type: ClusterIP

          persistence:
            enabled: false

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true